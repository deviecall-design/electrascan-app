<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElectraScan - Electrical Estimating Software</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      /* Match AppShell page background so first paint is navy, not cream/slate. */
      background-color: #0f172a;
      color: #f1f5f9;
    }

    /* Custom scrollbar for better UI */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e293b;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .react-pdf__Page__canvas {
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    /* Force inputs to be light themed */
    input,
    select,
    textarea {
      background-color: #ffffff;
      color: #0f172a;
      color-scheme: light;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
 
</head>

<body class="h-screen w-screen flex flex-col" style="background-color:#0f172a;color:#f1f5f9">
  <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
